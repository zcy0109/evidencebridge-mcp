<VirtualHost *:80>
    ServerName evidencebridge.example.org
    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass        /api/evidence-service/ http://127.0.0.1:5001/ timeout=30 retry=1
    ProxyPassReverse /api/evidence-service/ http://127.0.0.1:5001/
    ProxyPass        / http://127.0.0.1:3000/ timeout=60 retry=1
    ProxyPassReverse / http://127.0.0.1:3000/

    LimitRequestBody 10485760
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog  ${APACHE_LOG_DIR}/evidencebridge-error.log
    CustomLog ${APACHE_LOG_DIR}/evidencebridge-access.log combined
</VirtualHost>

# Production note: terminate TLS, restrict the Flask path to loopback/service traffic,
# store secrets outside this file, and enable proxy_http, headers, and ssl modules.
