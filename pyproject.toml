[tool.pytest.ini_options]
pythonpath = [".", "apps/flask-service", "peft"]
testpaths = ["apps/flask-service/tests", "evaluation/tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905", "UP006", "UP007", "UP035", "UP045"]
