services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evidencebridge}
      POSTGRES_USER: ${POSTGRES_USER:-evidencebridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-nonlocal-use}
    ports:
      - "5432:5432"
    volumes:
      - evidencebridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evidencebridge} -d ${POSTGRES_DB:-evidencebridge}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  evidencebridge_pgdata:
