packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - "@prisma/engines"
  - esbuild
  - msgpackr-extract
  - prisma
  - workerd
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: set this to true or false
  prisma: true
  sharp: true
  workerd: set this to true or false
