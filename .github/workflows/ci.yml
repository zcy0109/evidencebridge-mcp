name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evidencebridge
          POSTGRES_USER: evidencebridge
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evidencebridge -d evidencebridge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://evidencebridge:ci-password@localhost:5432/evidencebridge?schema=public
      RUN_POSTGRES_TESTS: "true"
      MODEL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pnpm install --frozen-lockfile
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r apps/flask-service/requirements-dev.txt
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm --filter @evidencebridge/db build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm evaluate
